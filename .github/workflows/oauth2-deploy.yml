name: oauth2-deploy

on:
  push:
    branches: [develop, staging, production]
    paths:
      - "oauth2/**"
      - "terraform/**"
      - ".github/workflows/oauth2-*.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: oauth2-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.OAUTH2_TF_STATE_BUCKET }}
  TF_STATE_KMS_KEY_ID: ${{ vars.OAUTH2_TF_STATE_KMS_KEY_ID }}
  AWS_REGION: ${{ vars.OAUTH2_AWS_REGION }}
  VAULT_ADDR: ${{ vars.OAUTH2_VAULT_ADDR }}
  VAULT_CA_PEM: ${{ vars.OAUTH2_VAULT_CA_PEM }}
  ALLOW_SECRET_BOOTSTRAP: "true"

jobs:
  validate:
    uses: ./.github/workflows/oauth2-validate.yml

  discover:
    needs: validate
    runs-on: arc-runner-set
    outputs:
      environment: ${{ steps.environment.outputs.value }}
      applications: ${{ steps.changes.outputs.applications }}
      platform_changed: ${{ steps.changes.outputs.platform_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - id: environment
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) value=development ;;
            staging) value=staging ;;
            production) value=production ;;
            *) exit 2 ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - id: changes
        shell: bash
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          result="$(python3 oauth2/tools/changed.py "$BASE" "$HEAD")"
          echo "applications=$(jq -c '.applications' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "platform_changed=$(jq -r '.platform_changed' <<<"$result")" >> "$GITHUB_OUTPUT"

  plan-platform:
    needs: discover
    if: >-
      needs.discover.outputs.environment == 'development' &&
      needs.discover.outputs.platform_changed == 'true'
    runs-on: arc-runner-set
    timeout-minutes: 30
    env:
      AWS_ROLE_ARN: ${{ fromJSON(vars.OAUTH2_AWS_ROLE_ARNS)[needs.discover.outputs.environment] }}
      VAULT_ROLE: ${{ fromJSON(vars.OAUTH2_VAULT_ROLES)[needs.discover.outputs.environment] }}
      PF_HTTPS_HOST: ${{ fromJSON(vars.OAUTH2_PF_HOSTS)[needs.discover.outputs.environment] }}
      PF_INSECURE_TRUST_ALL_TLS: ${{ vars.OAUTH2_PF_INSECURE_TRUST_ALL_TLS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: bash oauth2/tools/terraform_ci.sh plan "${{ needs.discover.outputs.environment }}" platform

  apply-platform:
    needs: [discover, plan-platform]
    runs-on: arc-runner-set
    timeout-minutes: 30
    environment: ${{ needs.discover.outputs.environment }}
    env:
      AWS_ROLE_ARN: ${{ fromJSON(vars.OAUTH2_AWS_ROLE_ARNS)[needs.discover.outputs.environment] }}
      VAULT_ROLE: ${{ fromJSON(vars.OAUTH2_VAULT_ROLES)[needs.discover.outputs.environment] }}
      PF_HTTPS_HOST: ${{ fromJSON(vars.OAUTH2_PF_HOSTS)[needs.discover.outputs.environment] }}
      PF_INSECURE_TRUST_ALL_TLS: ${{ vars.OAUTH2_PF_INSECURE_TRUST_ALL_TLS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: bash oauth2/tools/terraform_ci.sh apply "${{ needs.discover.outputs.environment }}" platform

  plan-applications:
    needs: [discover, apply-platform]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      (needs.apply-platform.result == 'success' || needs.apply-platform.result == 'skipped') &&
      needs.discover.outputs.applications != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.applications) }}
    runs-on: arc-runner-set
    timeout-minutes: 30
    env:
      AWS_ROLE_ARN: ${{ fromJSON(vars.OAUTH2_AWS_ROLE_ARNS)[needs.discover.outputs.environment] }}
      VAULT_ROLE: ${{ fromJSON(vars.OAUTH2_VAULT_ROLES)[needs.discover.outputs.environment] }}
      PF_HTTPS_HOST: ${{ fromJSON(vars.OAUTH2_PF_HOSTS)[needs.discover.outputs.environment] }}
      PF_INSECURE_TRUST_ALL_TLS: ${{ vars.OAUTH2_PF_INSECURE_TRUST_ALL_TLS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: bash oauth2/tools/terraform_ci.sh plan "${{ needs.discover.outputs.environment }}" "${{ matrix.target }}"

  apply-applications:
    needs: [discover, plan-applications]
    if: needs.plan-applications.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.applications) }}
    runs-on: arc-runner-set
    timeout-minutes: 30
    environment: ${{ needs.discover.outputs.environment }}
    env:
      AWS_ROLE_ARN: ${{ fromJSON(vars.OAUTH2_AWS_ROLE_ARNS)[needs.discover.outputs.environment] }}
      VAULT_ROLE: ${{ fromJSON(vars.OAUTH2_VAULT_ROLES)[needs.discover.outputs.environment] }}
      PF_HTTPS_HOST: ${{ fromJSON(vars.OAUTH2_PF_HOSTS)[needs.discover.outputs.environment] }}
      PF_INSECURE_TRUST_ALL_TLS: ${{ vars.OAUTH2_PF_INSECURE_TRUST_ALL_TLS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: bash oauth2/tools/terraform_ci.sh apply "${{ needs.discover.outputs.environment }}" "${{ matrix.target }}"
