name: oauth2-pr-plan

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Approved internal OAuth2 pull request number
        required: true
        type: number

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: arc-runner-set
    timeout-minutes: 60
    steps:
      - name: Require protected workflow source
        run: |
          case "$GITHUB_REF_NAME" in develop|staging|production) ;; *) exit 1 ;; esac
      - name: Create review GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.OAUTH2_REVIEW_APP_ID }}
          private-key: ${{ secrets.OAUTH2_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned validators
        run: python3 -m pip install --disable-pip-version-check -r oauth2/tools/requirements.txt
      - name: Verify approvals
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 oauth2/tools/review_gate.py
      - name: Overlay YAML only
        id: overlay
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 oauth2/tools/overlay_pr.py
      - name: Validate overlaid data
        run: python3 oauth2/tools/oauth2_config.py validate
      - name: Plan approved data
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
          TF_STATE_BUCKET: ${{ vars.OAUTH2_TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ID: ${{ vars.OAUTH2_TF_STATE_KMS_KEY_ID }}
          AWS_REGION: ${{ vars.OAUTH2_AWS_REGION }}
          VAULT_ADDR: ${{ vars.OAUTH2_VAULT_ADDR }}
          AWS_ROLE_ARN: ${{ fromJSON(vars.OAUTH2_AWS_ROLE_ARNS)[steps.overlay.outputs.environment] }}
          VAULT_ROLE: ${{ fromJSON(vars.OAUTH2_VAULT_ROLES)[steps.overlay.outputs.environment] }}
          PF_HTTPS_HOST: ${{ fromJSON(vars.OAUTH2_PF_HOSTS)[steps.overlay.outputs.environment] }}
          TARGETS: ${{ steps.overlay.outputs.targets }}
          PLATFORM_CHANGED: ${{ steps.overlay.outputs.platform_changed }}
          ENVIRONMENT: ${{ steps.overlay.outputs.environment }}
        run: |
          if [ "$PLATFORM_CHANGED" = true ]; then bash oauth2/tools/terraform_ci.sh plan "$ENVIRONMENT" platform; fi
          jq -r '.[]' <<<"$TARGETS" | while IFS= read -r target; do
            bash oauth2/tools/terraform_ci.sh plan "$ENVIRONMENT" "$target"
          done
