name: oauth2-review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["oauth2/**", "terraform/**", ".github/workflows/oauth2-*.yml"]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  approvals:
    if: github.event.pull_request != null
    runs-on: arc-runner-set
    timeout-minutes: 10
    steps:
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
        with:
          app-id: ${{ vars.OAUTH2_REVIEW_APP_ID }}
          private-key: ${{ secrets.OAUTH2_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout trusted base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify current-commit team approvals
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 oauth2/tools/review_gate.py
