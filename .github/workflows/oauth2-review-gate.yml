name: oauth2-review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["oauth2/**", "terraform/**", ".github/workflows/oauth2-*.yml"]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  approvals:
    if: github.event.pull_request != null
    runs-on: arc-runner-set
    timeout-minutes: 10
    steps:
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OAUTH2_REVIEW_APP_ID }}
          private-key: ${{ secrets.OAUTH2_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify current-commit team approvals
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 oauth2/tools/review_gate.py
