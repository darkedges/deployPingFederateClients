# yaml-language-server: $schema=../schemas/oauth2-client.schema.json
apiVersion: pingfederate.oauth2/v1alpha1
kind: OAuth2Client
metadata:
  organisation: darkedges
  application: test-client
lifecycle:
  state: active
spec:
  name: DarkEdges test client
  description: Enabled confidential OAuth2/OIDC client for deployment verification.
  profile: confidential_web
  clientId: darkedges-test-client
  accessTokenManager: default-reference
  oidcPolicy: default-oidc
  scopes:
    - openid
    - profile
    - email
  authentication:
    method: client_secret
    secretRef: client_secret
  environments:
    development:
      redirectUris:
        - https://localhost/callback
    staging:
      redirectUris:
        - https://localhost/callback
    production:
      redirectUris:
        - https://localhost/callback
